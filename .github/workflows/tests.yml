name: Tests

# Lance les tests seulement quand le code change (pour économiser les minutes GitHub).
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "*.config.*"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npx eslint .
